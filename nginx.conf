server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm application/zip;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Python en el navegador (Pyodide) y las librerías de pruebas: archivos grandes que no cambian
    location ~ ^/(pyodide|wheels)/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
